[lib]
name = "battlerustlib"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
[package]
name = "battlerust"
version = "1.0.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
[features]
all=["explode","bigshield","shrapnel","perround","stun","escape","rfcancel"]
default = ["all","server","crossbeam"]
server=["axum","tokio","tower-http"]
reference = ["explode"]
stun=["flags_other","flags_self"]
escape=["flags_other"]
bigshield=[]
rfcancel=[]
explode = []
shrapnel = []
perround = []
flags_self=[]
flags_other=[]
wasm = ["all","wasm-bindgen","getrandom"]
[dependencies]
rand = "0.10.0"
serde = {version="1.0.228" , features = ["derive"]}
serde_json = "1.0.149"
crossbeam = {version="0.8.4", optional=true}
wasm-bindgen = {version="0.2.114", optional=true}
getrandom = { version = "0.4", features = ["wasm_js"], optional=true }
axum = {version="0.8", optional=true}
tokio = { version = "1", features = ["full"] , optional=true}
tower-http = { version = "0.7", features = ["fs"], optional=true }
num-traits = "0.2.19"
rand_xoshiro = "0.8.1"
