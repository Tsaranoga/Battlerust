<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WASM Demo</title>
</head>
<body>
  <h1>WASM Test</h1>
<textarea id="marea">  {
        "rounds":6,
        "attacker": [
            {
                "name": 123,
                "ships": [
                    {"shipid":12, "attack": 400.0, "hull": 2700.0, "shield": 50.0, "explode": 0.7, "amount": 1000000, "rapidfire":{"201":10,"11":5,"10":3} },
                    {"shipid":13, "attack": 1000.0, "hull": 6000.0, "shield": 50.0, "explode": 0.7, "amount": 1000000, "rapidfire":{"444":10} }
                    
                ]
            }
        ],
        "defender": [
                    {
                "name": 1234,
                "ships": [
                    {"shipid":10, "attack": 400.0, "hull": 2700.0, "shield": 50.0, "explode": 0.7, "amount": 1000000, "rapidfire":{"201":10} },
                    {"shipid":11, "attack": 1000.0, "hull": 6000.0, "shield": 50.0, "explode": 0.7, "amount": 1000000, "rapidfire":{"444":10} }
                    
                ]
            }
        ]
    }</textarea>
  <button id="run">Run</button><div id="time"></div><br>
  <pre id="output"></pre>

  <script type="module">
    import init, { wasm_fight_battle_rounds} from "./pkg/battlerustlib.js";

    async function run() {
      // initialize WASM module
      await init();
	const start = performance.now();

      const result = wasm_fight_battle_rounds(document.getElementById("marea").value);
const end = performance.now();
      document.getElementById("output").textContent = JSON.stringify(JSON.parse(result), null, "\t");
document.getElementById("time").innerText=`Time: ${end - start} ms`

    }
    document.getElementById("run").onclick = run;
  </script>
</body>
</html>
